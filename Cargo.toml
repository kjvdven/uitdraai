[package]
name = "uitdraai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.55.0", default-features = false, features = ["syntect-fancy"] }
directories = "6.0.0"
# webkit6 0.6.1 needs gtk::Accessible but does not enable gtk4's v4_10 feature itself.
gtk4 = { version = "0.11.5", features = ["v4_10"], optional = true }
notify-debouncer-mini = "0.7.0"
webkit6 = { version = "0.6.1", optional = true }

[features]
default = ["gui"]
gui = ["dep:webkit6", "dep:gtk4"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
