[package]
name = "uitdraai"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
async-channel = { version = "2.5.0", optional = true }
chordsketch-chordpro = "0.7.0"
chordsketch-render-html = "0.7.0"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.55.0", default-features = false, features = ["syntect-fancy"] }
directories = "6.0.0"
# webkit6 0.6.1 needs gtk::Accessible but does not enable gtk4's v4_10 feature itself.
gtk4 = { version = "0.11.5", features = ["v4_10"], optional = true }
notify-debouncer-mini = "0.7.0"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
toml = "1.1.6"
webkit6 = { version = "0.6.1", optional = true }

[features]
default = ["gui"]
gui = ["dep:webkit6", "dep:gtk4", "dep:async-channel", "dep:serde_json"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
